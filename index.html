<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>حاسبة احتياجات الحيوان</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>حاسبة احتياجات البروتين والطاقة</h1>

    <label>اختر الطريقة:</label>
    <select id="method" onchange="onMethodChange()">
      <option value="traditional">التقليدية</option>
      <option value="tmr">TMR</option>
      <option value="nrc">NRC</option>
    </select>
    
<label>اختر الطريقة:</label>
    <select id="method" onchange="onMethodChange()">
      <option value="traditional">أبقار</option>
      <option value="tmr">جاموس</option>
      <option value="nrc">أغنام</option>
    </select>
    
    <div class="row">
      <label>الجنس:</label>
      <select id="gender" onchange="onGenderChange()">
        <option value="male">ذكر</option>
        <option value="female">أنثى</option>
      </select>
    </div>

    <div id="milkOption" class="hidden">
      <label>نوع الأنثى:</label>
      <select id="femaleType" onchange="onFemaleTypeChange()">
        <option value="dry">غير حلاب</option>
        <option value="lactating">حلاب</option>
      </select>
    </div>

    <div id="milkInput" class="hidden">
      <label>لتر حليب/يوم:</label>
      <input type="number" id="milkLiters" min="0" />
    </div>

    <div class="row">
      <label>الوزن (كجم):</label>
      <input type="number" id="weight" min="0" />
    </div>

    <div id="tmrSection" class="hidden">
      <small>يحسب 4.5% من الوزن كعلف جاف</small>
    </div>

    <button onclick="calculate()">احسب</button>

    <div id="result" class="result hidden">
      <h2>النتيجة</h2>
      <pre id="output"></pre>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
